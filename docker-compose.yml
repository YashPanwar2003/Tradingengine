services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces TCP, so "ready" can't fire during the init-time socket-only server
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d trading"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # not published to the host on purpose: your dev (5432) and test (5433) containers use those ports.
    # to reach it from your machine, add:  ports: ["5434:5432"]

  engine:
    build:
      context: .
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/trading?sslmode=disable
      ENGINE_API_KEY: ${ENGINE_API_KEY:?set ENGINE_API_KEY in .env}
      ENGINE_ADDR: ":8080"
    ports:
      - "${ENGINE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s          # time for the HTTP drain plus flushing queued database writes
    restart: unless-stopped

volumes:
  pgdata: